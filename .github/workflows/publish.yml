# Publishes @neuroplastio/hotty to npm by trusted publishing (OIDC): no npm
# token anywhere, and no 2FA prompt. The package's trusted publisher on
# npmjs.com names this repository and this file, so a run of this workflow
# is the one thing that can publish without a person's 2FA. npm takes
# GitHub's hosted runners only; this repository is public. A publish is the
# maintainer's go-ahead (gov P-5 rule 5).
#
# The first version, 0.4.0, was published by hand: npm sets a trusted
# publisher only on a package that exists.
#
# Bump the version on main (npm version X.Y.Z --no-git-tag-version), then:
#   gh workflow run publish.yml -R neuroplastio/hotty-ts
name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for this one publish

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The spec's conformance vectors, which the gate checks the copy against.
      HOTTY_DIR: ${{ github.workspace }}/.hotty
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: neuroplastio/hotty
          path: .hotty
      # Node, npm and Bun as mise.toml pins them.
      - uses: jdx/mise-action@v4
      # gov P-5 rule 6: X.Y is the hotty version the SDK speaks, VERSION in
      # src/constants.ts. A release, X.Y.Z, goes to latest; a prerelease,
      # X.Y.Z-next.N, under next, and latest stays the last release.
      - name: version
        id: version
        run: |
          v=$(node -p 'require("./package.json").version')
          spec=$(node --input-type=module -e 'import { VERSION } from "./src/constants.ts"; console.log(VERSION)')
          n='(0|[1-9][0-9]*)'
          xy=${spec//./\\.}
          if [[ $v =~ ^${xy}\.${n}$ ]]; then
            tag=latest
          elif [[ $v =~ ^${xy}\.${n}-next\.${n}$ ]]; then
            tag=next
          else
            echo "::error::$v: a version is $spec.Z or $spec.Z-next.N, since the SDK speaks hotty $spec"; exit 1
          fi
          if [ -n "$(npm view "@neuroplastio/hotty@$v" version 2>/dev/null)" ]; then
            echo "::error::$v is on npm already: bump the version"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $v under $tag"
      - run: make install
      - name: gate
        run: make check
      # prepack builds dist, which is all the package ships.
      - name: publish
        run: npm publish --tag ${{ steps.version.outputs.tag }}
